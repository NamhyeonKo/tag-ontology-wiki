[project]
name = "tag-ontology-wiki"
version = "0.4.1"
description = "TOW: document management inside an Obsidian vault with content-preserving formatting and frontmatter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pyright", "pytest", "ruff"]

[tool.ruff]
line-length = 120
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
